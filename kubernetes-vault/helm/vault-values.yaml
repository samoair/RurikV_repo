# ============================================================================
# Vault Helm Values for HA mode with Consul storage backend
# Installation: helm install vault hashicorp/vault -n vault --create-namespace -f vault-values.yaml
# IMPORTANT: After install, patch the ConfigMap to fix Consul address:
#   kubectl get configmap vault-config -n vault -o json | \
#     python3 -c "import json,sys; cm=json.load(sys.stdin); \
#     cm['data']['extraconfig-from-values.hcl']=cm['data']['extraconfig-from-values.hcl'].replace('HOST_IP:8500','consul-consul-server.consul.svc.cluster.local:8500'); \
#     json.dump(cm,sys.stdout)" | kubectl apply -f -
#   kubectl delete pod -n vault vault-0 vault-1 vault-2
# ============================================================================

# Global settings
global:
  enabled: true
  tlsDisable: true

# Enable Vault UI
ui:
  enabled: true
  serviceType: "LoadBalancer"

# Server configuration
server:
  enabled: true

  # Disable standalone mode (we use HA)
  standalone:
    enabled: false

  # HA configuration with Consul storage
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: false

  # Tolerations for infra nodes
  tolerations: |
    - key: "node-role"
      operator: "Equal"
      value: "infra"
      effect: "NoSchedule"

  # Node selector for infra nodes
  nodeSelector: |
    node-role: "infra"

  # Update strategy
  updateStrategyType: "OnDelete"

# Disable injector (not needed for this homework)
injector:
  enabled: false

# Disable CSI (not needed)
csi:
  enabled: false

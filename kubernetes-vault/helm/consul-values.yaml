# Consul Helm Values for HA mode in Kubernetes
# Installation: helm install consul hashicorp/consul -n consul --create-namespace -f consul-values.yaml

server:
  replicas: 3
  storage: "1Gi"
  bootstrapExpect: 3

  # Tolerations and nodeSelector as YAML strings (required by chart)
  tolerations: |
    - key: "node-role"
      operator: "Equal"
      value: "infra"
      effect: "NoSchedule"

  nodeSelector: |
    node-role: "infra"

  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: consul
              component: server
          topologyKey: kubernetes.io/hostname

client:
  enabled: true
  join: ["consul-consul-server"]
  tolerations: |
    - key: "node-role"
      operator: "Equal"
      value: "infra"
      effect: "NoSchedule"
  nodeSelector: |
    node-role: "infra"

ui:
  enabled: true
  service:
    type: "LoadBalancer"

connectInject:
  enabled: false

dns:
  enabled: true

acl:
  enabled: false

tls:
  enabled: false

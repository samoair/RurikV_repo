# ============================================================================
# External Secrets Operator Helm Values
# Installation: helm install external-secrets external-secrets/external-secrets -n vault -f eso-values.yaml
# ============================================================================

# Global settings
global:
  # Namespace where ESO is installed
  namespace: "vault"

# Image configuration
image:
  repository: ghcr.io/external-secrets/external-secrets
  tag: v0.11.1
  pullPolicy: IfNotPresent

# Replica count for ESO controller
replicaCount: 1

# Resources for ESO pods
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Node selector to prefer infra nodes
nodeSelector:
  node-role: "infra"

# Tolerations to allow scheduling on tainted infra nodes
tolerations:
  - key: "node-role"
    operator: "Equal"
    value: "infra"
    effect: "NoSchedule"

# Service account configuration
serviceAccount:
  create: true
  name: "external-secrets"
  annotations: {}
  automountServiceAccountToken: true

# RBAC configuration
rbac:
  create: true

# Controller configuration
controller:
  # Number of workers for reconciliation
  workers: 10

  # Log level
  logLevel: info
  logFormat: json

  # Metrics configuration
  metrics:
    enabled: true
    service:
      enabled: true
      port: 8080
      servicePort: 8080

# Webhook configuration
webhook:
  # Port for the webhook server
  port: 9443

# CertController configuration
certController:
  enabled: true
  logLevel: info
  logFormat: json

# Create custom resource definitions
createCustomResourceDefinition: true

# PriorityClassName for pods
# priorityClassName: ""

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Security context
securityContext: {}
#   runAsNonRoot: true
#   runAsUser: 1000
#   fsGroup: 1000

# Container security context
containerSecurityContext: {}
#   allowPrivilegeEscalation: false
#   capabilities:
#     drop:
#       - ALL

# Liveness probe
livenessProbe:
  enabled: true

# Readiness probe
readinessProbe:
  enabled: true

# Service monitor for Prometheus (optional)
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s

# Extra environment variables
env: []

# Extra volumes
volumes: []

# Extra volume mounts
volumeMounts: []

# Node affinity
affinity: {}

# Topology spread constraints
topologySpreadConstraints: []

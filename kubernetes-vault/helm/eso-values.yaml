# ============================================================================
# External Secrets Operator Helm Values
# Installation: helm install external-secrets external-secrets/external-secrets \
#   -n vault -f eso-values.yaml
# ============================================================================

replicaCount: 1

# Resources for ESO pods
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Node selector to schedule on infra nodes
nodeSelector:
  node-role: "infra"

# Tolerations to allow scheduling on tainted infra nodes
tolerations:
  - key: "node-role"
    operator: "Equal"
    value: "infra"
    effect: "NoSchedule"

# Service account configuration
serviceAccount:
  create: true
  name: "external-secrets"
  automountServiceAccountToken: true

# RBAC configuration
rbac:
  create: true

# Create custom resource definitions
createCustomResourceDefinition: true

# ============================================================================
# ExternalSecret CRD for otus-cred
# Fetches /otus/cred from Vault and creates a Kubernetes secret
# ============================================================================
# Prerequisites:
# 1. Vault must be initialized and unsealed
# 2. KV secrets engine must be enabled at /otus
# 3. Secret /otus/cred must exist with 'username' and 'password' keys
# 4. SecretStore 'vault-backend' must be ready
# ============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: otus-cred
  namespace: vault
  labels:
    app: vault
    project: otus-k8s-vault
spec:
  # Refresh interval (how often to check for updates)
  refreshInterval: 15m

  # SecretStore to use for fetching secrets
  secretStoreRef:
    name: vault-backend
    kind: SecretStore

  # Target secret configuration
  target:
    # Name of the Kubernetes secret to create
    name: otus-cred

    # Type of the Kubernetes secret
    creationPolicy: Owner

    # Template for the secret (optional - specifies structure)
    template:
      type: Opaque
      # Data template - maps Vault keys to Secret keys
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"

  # Data to fetch from Vault
  data:
    # First secret mapping
    - secretKey: username
      remoteRef:
        # Path in Vault (KV v2 format: data/ prefix is added automatically)
        key: otus/cred
        property: username

    # Second secret mapping
    - secretKey: password
      remoteRef:
        # Path in Vault (KV v2 format: data/ prefix is added automatically)
        key: otus/cred
        property: password

  # Optional: Additional configuration
  # dataFrom:
  #   - key: otus/cred
  #     property: username
  #     version: "v2"

# ============================================================================
# ExternalSecret CRD for otus-cred
# Fetches /otus/cred from Vault and creates a Kubernetes secret
# ============================================================================

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otus-cred
  namespace: vault
  labels:
    app: vault
    project: otus-k8s-vault
spec:
  # Refresh interval (how often to check for updates)
  refreshInterval: 15m

  # SecretStore to use for fetching secrets
  secretStoreRef:
    name: vault-backend
    kind: SecretStore

  # Target secret configuration
  target:
    name: otus-cred
    creationPolicy: Owner
    template:
      type: Opaque

  # Data to fetch from Vault
  data:
    - secretKey: username
      remoteRef:
        key: otus/cred
        property: username

    - secretKey: password
      remoteRef:
        key: otus/cred
        property: password

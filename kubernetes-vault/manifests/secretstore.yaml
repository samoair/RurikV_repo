# ============================================================================
# SecretStore CRD for Vault backend
# This defines how to connect to Vault to fetch secrets
# ============================================================================

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: vault
  labels:
    app: vault
    project: otus-k8s-vault
spec:
  # Provider configuration for Vault
  provider:
    vault:
      # Vault server address (within cluster)
      # Use vault-active service to avoid hitting sealed standby pods
      server: "http://vault-active.vault.svc.cluster.local:8200"

      # Vault version (KV engine version)
      version: "v2"

      # Authentication using Kubernetes service account
      auth:
        kubernetes:
          # Mount path of the Kubernetes auth method in Vault
          mountPath: "kubernetes"

          # Vault role to use
          role: "otus"

          # Service account to authenticate as
          serviceAccountRef:
            name: "vault-auth"
            namespace: "vault"

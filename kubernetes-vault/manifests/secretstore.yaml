# ============================================================================
# SecretStore CRD for Vault backend
# This defines how to connect to Vault to fetch secrets
# ============================================================================
# Prerequisites:
# 1. Vault must be running and accessible
# 2. Vault Kubernetes auth method must be enabled and configured
# 3. Vault role 'otus' must exist with policy 'otus-policy'
# ============================================================================

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: vault
  labels:
    app: vault
    project: otus-k8s-vault
spec:
  # Provider configuration for Vault
  provider:
    vault:
      # Vault server address (within cluster)
      server: "http://vault.vault.svc.cluster.local:8200"

      # Vault namespace (Enterprise feature, leave empty for OSS)
      namespace: ""

      # Path to the Kubernetes auth method in Vault
      path: "kubernetes"

      # Vault version
      version: "v2"

      # Authentication using Kubernetes service account
      auth:
        kubernetes:
          # Mount path of the Kubernetes auth method in Vault
          mountPath: "kubernetes"

          # Vault role to use
          role: "otus"

          # Service account to authenticate as
          serviceAccountRef:
            name: "vault-auth"
            namespace: "vault"

      # Optional: TLS configuration
      # tls:
      #   caCert:
      #     secretRef:
      #       name: vault-ca-cert
      #       key: ca.crt
      #   clientCert:
      #     secretRef:
      #       name: vault-client-cert
      #       key: tls.crt
      #   clientKey:
      #     secretRef:
      #       name: vault-client-key
      #       key: tls.key

  # Optional: Refresh interval for secrets
  refreshInterval: "15m"

  # Status of the SecretStore (will be updated by controller)
  status:
    conditions:
      - type: Ready
        status: "True"
        message: "SecretStore is ready"
